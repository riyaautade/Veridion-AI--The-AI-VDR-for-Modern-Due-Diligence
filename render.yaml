services:
  # ──────────────────────────────────────
  # FastAPI Backend (Docker-based web service)
  # ──────────────────────────────────────
  - type: web
    name: veridion-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    disks:
      - name: documents
        mountPath: /storage/documents
        sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veridion-ai-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: QDRANT_HOST
        value: ""
        sync: true
      - key: QDRANT_PORT
        value: 6333
      - key: QDRANT_API_KEY
        value: ""
        sync: true
      - key: DOCUMENT_STORAGE_DIR
        value: /storage/documents
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        value: ""
        sync: true
      - key: ALLOWED_ORIGINS
        value: https://veridion-ai-frontend.onrender.com

  # ──────────────────────────────────────
  # React / Vite Frontend (static site)
  # ──────────────────────────────────────
  - type: web
    name: veridion-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://veridion-ai-backend.onrender.com/api

# ──────────────────────────────────────
# PostgreSQL Managed Database
# ──────────────────────────────────────
databases:
  - name: veridion-ai-postgres
    plan: free
